[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dropin-tts-harmonia"
version = "1.0.0"
description = "Numpy-only TTS engine with a drop-in HarmoniaCodec slot"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
